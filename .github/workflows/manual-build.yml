name: Manual OpenWrt Build

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Source repo to build.
        required: true
        type: choice
        options:
          - lede
          - immortalwrt
      device:
        description: Device id from manifests/builds.json, or all.
        required: true
        type: choice
        options:
          - all
          - x86_64
          - x86_64-lite
          - rpi3
          - rpi4
          - rpi5
          - rockchip
        default: all
      flavor:
        description: Firmware flavor.
        required: true
        type: choice
        options:
          - all
          - standard
          - lite
        default: all
      branch:
        description: Override upstream branch. Leave empty to use manifest default.
        required: false
        type: string
        default: ""
      upload_release:
        description: Upload firmware to GitHub Releases.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      repo: ${{ steps.matrix.outputs.repo }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve manual build matrix
        id: matrix
        run: |
          python3 scripts/resolve-matrix.py \
            --repo "${{ inputs.repo }}" \
            --device "${{ inputs.device }}" \
            --flavor "${{ inputs.flavor }}" \
            --branch "${{ inputs.branch }}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    uses: ./.github/workflows/build-openwrt.yml
    with:
      repo: ${{ matrix.repo }}
      branch: ${{ matrix.branch }}
      device: ${{ matrix.id }}
      op_name: ${{ matrix.op_name }}
      flavor: ${{ matrix.flavor }}
      target_config: ${{ matrix.target_config }}
      app_config: ${{ matrix.app_config }}
      driver_config: ${{ matrix.driver_config }}
      cache_scope: ${{ matrix.cache_scope }}
      upload_release: ${{ inputs.upload_release }}
    secrets: inherit
